<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Phòng thí nghiệm: ấm nước sôi bị đổ, cánh tay bạn học đỏ và phồng rộp, trên tay có đồng hồ">
